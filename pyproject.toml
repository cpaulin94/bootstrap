[project]
name = "bootstrap"
version = "0.1.0"
description = "Monte-Carlo bootstrap portfolio simulator with a Tkinter GUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.1.2",
]

[project.scripts]
bootstrap-gui = "main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["engine/**", "gui.py", "main.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "."
